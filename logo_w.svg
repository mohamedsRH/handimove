<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Symbole d'accessibilité stylisé - maintenant centré en haut -->
  <g transform="translate(140, 40)">
    <!-- Cercle principal -->
    <circle cx="60" cy="60" r="55" fill="#FFF" stroke="#E6B89C" stroke-width="3"/>
    
    <!-- Figure humaine stylisée -->
    <circle cx="60" cy="35" r="17" fill="#E6B89C" />
    <path d="M40 65 L60 50 L80 65 L75 90 L45 90 Z" fill="#E6B89C" />
    
  </g>

  <!-- Texte "Handimove" - déplacé vers le bas -->
  <text x="200" y="240" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#FFF"
        filter="url(#shadow)">
    Handi<tspan fill="#E6B89C">Move</tspan>
  </text>
  
  <!-- Slogan - déplacé sous le nom -->
  <text x="200" y="280" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        fill="#FFF"
        filter="url(#shadow)">
    La mobilité accessible à tous
  </text>
</svg>